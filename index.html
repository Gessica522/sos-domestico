<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOS Doméstico — Primeiros socorros em acidentes domésticos</title>
<meta name="description" content="Converse com o SOS Doméstico, assistente de IA com orientação inicial de primeiros socorros para acidentes domésticos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   SOS Doméstico — estilos
   Duas telas: 1) Capa (botão único de entrada)
               2) Chat em tela cheia (com ligação rápida e chips)
   ========================================================= */

:root {
  --blue-900: #0F3057;
  --blue-700: #1E5F8C;
  --blue-500: #3E92CC;
  --blue-300: #9CC7E6;
  --blue-100: #EAF4FB;
  --white: #FFFFFF;
  --ink: #16324F;
  --ink-soft: #4A6482;

  --red-emergency: #C1272D;
  --red-emergency-dark: #971E23;

  --font-display: "Space Grotesk", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  line-height: 1.5;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; }

[hidden] { display: none !important; }

/* =========================================================
   Tela 1 — Capa
   ========================================================= */
.cover {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  padding-top: calc(40px + env(safe-area-inset-top));
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, var(--blue-900) 0%, #0A2038 100%);
}

.cover-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  max-width: 380px;
  height: 100%;
  min-height: 560px;
}

.cover-top { display: flex; flex-direction: column; align-items: center; }
.cover-middle { display: flex; align-items: center; justify-content: center; }
.cover-bottom { display: flex; align-items: center; justify-content: center; }

.cover-icon { margin-bottom: 24px; }
.cover-icon svg { width: 156px; height: 156px; }

.cover-inner h1 {
  color: var(--white);
  font-size: 2rem;
  letter-spacing: -0.01em;
}

.cover-tagline {
  color: rgba(255, 255, 255, 0.82);
  margin: 10px 0 0;
  font-size: 1.02rem;
}

.enter-chat-wrap { position: relative; display: inline-flex; }

.enter-chat-ring {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 2px solid var(--red-emergency);
  animation: cover-ring-ping 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
  pointer-events: none;
}

.enter-chat-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #D2383E 0%, var(--red-emergency) 45%, var(--red-emergency-dark) 100%);
  color: var(--white);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1.04rem;
  line-height: 1.28;
  padding: 12px 30px 12px 12px;
  border-radius: 999px;
  text-align: left;
  max-width: 300px;
  box-shadow: 0 16px 34px rgba(151, 30, 35, 0.4), 0 3px 8px rgba(0, 0, 0, 0.2);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}
.enter-chat-icon-badge {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.enter-chat-btn svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.enter-chat-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 40px rgba(151, 30, 35, 0.46), 0 4px 10px rgba(0, 0, 0, 0.24);
}
.enter-chat-btn:active { transform: translateY(0) scale(0.98); }

@keyframes cover-ring-ping {
  0% { transform: scale(1); opacity: 0.55; }
  100% { transform: scale(1.35); opacity: 0; }
}

.cover-note {
  color: rgba(255, 255, 255, 0.65);
  font-size: 0.85rem;
  max-width: 34ch;
}
.cover-note strong { color: rgba(255, 255, 255, 0.9); }

/* =========================================================
   Tela 2 — Chat em tela cheia
   ========================================================= */
.chat-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  background: var(--white);
}

.chat-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--blue-900);
  color: var(--white);
  padding: 14px 18px;
  padding-top: calc(14px + env(safe-area-inset-top));
}

.chat-header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
}
.chat-header-brand svg { width: 34px; height: 34px; flex-shrink: 0; }

.chat-back-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.14);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background-color 0.15s ease;
}
.chat-back-btn:hover { background: rgba(255, 255, 255, 0.26); }
.chat-back-btn svg { width: 18px; height: 18px; }

.chat-quick-calls {
  flex-shrink: 0;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px 16px;
  background: var(--blue-100);
}

.quick-call-btn {
  flex: 1 1 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--red-emergency);
  color: var(--white);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.92rem;
  padding: 12px 14px;
  border-radius: 999px;
  transition: background-color 0.15s ease;
}
.quick-call-btn:hover { background: var(--red-emergency-dark); }
.quick-call-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.quick-call-btn strong { font-size: 1.02rem; }

.chat-topics {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 2px 16px 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chat-topics::-webkit-scrollbar { display: none; }

.topic-chip {
  flex-shrink: 0;
  background: var(--white);
  border: 1px solid rgba(15, 48, 87, 0.18);
  color: var(--blue-900);
  padding: 8px 16px;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.topic-chip:hover,
.topic-chip:focus-visible {
  background: var(--blue-100);
  border-color: var(--blue-500);
  outline: none;
}

.chat-mount {
  flex: 1;
  min-height: 0;
  padding-bottom: env(safe-area-inset-bottom);
}

@media (max-width: 480px) {
  .cover-icon svg { width: 126px; height: 126px; }
  .cover-inner h1 { font-size: 1.7rem; }
  .enter-chat-btn { max-width: 92vw; font-size: 0.96rem; padding: 10px 24px 10px 10px; }
  .enter-chat-icon-badge { width: 42px; height: 42px; }
  .quick-call-btn { flex-basis: 100%; }
}
</style>
</head>
<body>

<!-- ===================== TELA 1 — CAPA ===================== -->
<div class="cover" id="coverScreen">
  <div class="cover-inner">
    <div class="cover-top">
      <div class="cover-icon" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none">
          <path d="M14 56L60 16L106 56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 56L60 24L98 56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26 52V100H94V52" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
          <rect x="41" y="67" width="38" height="30" rx="3" stroke="#FFFFFF" stroke-width="2.6"/>
          <circle cx="60" cy="82" r="15.5" fill="#C1272D"/>
          <path d="M46 84h7l3-7 4 13 3-7h9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
          <rect x="57" y="73" width="6" height="17" rx="2" fill="#FFFFFF"/>
          <rect x="51.5" y="78.5" width="17" height="6" rx="2" fill="#FFFFFF"/>
        </svg>
      </div>
      <h1>SOS Doméstico</h1>
      <p class="cover-tagline">Orientação inicial para acidentes domésticos.</p>
    </div>

    <div class="cover-middle">
      <div class="enter-chat-wrap">
        <span class="enter-chat-ring" aria-hidden="true"></span>
        <button type="button" id="enterChatBtn" class="enter-chat-btn">
          <span class="enter-chat-icon-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h16a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="8.5" cy="10.5" r="1.15" fill="currentColor"/>
              <circle cx="12" cy="10.5" r="1.15" fill="currentColor"/>
              <circle cx="15.5" cy="10.5" r="1.15" fill="currentColor"/>
            </svg>
          </span>
          Clique para falar<br>com o Assistente
        </button>
      </div>
    </div>

    <div class="cover-bottom">
      <p class="cover-note">Conteúdo educativo. Em emergência, ligue <strong>192</strong> (SAMU) ou <strong>193</strong> (Bombeiros).</p>
    </div>
  </div>
</div>

<!-- ===================== TELA 2 — CHAT EM TELA CHEIA ===================== -->
<div class="chat-screen" id="chatScreen" hidden role="dialog" aria-modal="true" aria-label="Chat com o SOS Doméstico">
  <header class="chat-header">
    <div class="chat-header-brand">
      <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path d="M14 56L60 16L106 56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 56L60 24L98 56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26 52V100H94V52" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="60" cy="82" r="17" fill="#C1272D"/>
        <rect x="56.5" y="71" width="7" height="21" rx="2.5" fill="#FFFFFF"/>
        <rect x="49.5" y="78" width="21" height="7" rx="2.5" fill="#FFFFFF"/>
      </svg>
      <span>SOS Doméstico</span>
    </div>
    <button type="button" id="chatBackBtn" class="chat-back-btn" aria-label="Fechar chat e voltar">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div class="chat-quick-calls">
    <a href="tel:192" class="quick-call-btn">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 2.6c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
      <span>Ligar SAMU <strong>192</strong></span>
    </a>
    <a href="tel:193" class="quick-call-btn">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 2.6c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
      <span>Bombeiros <strong>193</strong></span>
    </a>
  </div>

  <div class="chat-topics" id="chatTopics" aria-label="Assuntos rápidos"></div>

  <div id="n8nChatMount" class="chat-mount"></div>
</div>

<!-- Widget de chat do n8n (pacote oficial @n8n/chat via CDN) -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  let chatInited = false;

  // Inicializa o widget do n8n só na primeira vez que o chat é aberto
  // (garante que o contêiner já esteja visível ao montar o widget).
  window.__initN8nChat = function () {
    if (chatInited) return;
    chatInited = true;

    createChat({
      // Substitua pela URL de produção do seu Webhook / Chat Trigger no n8n.
      webhookUrl: 'https://ufratcc2026.app.n8n.cloud/webhook/primeiros-socorros-chat/chat',

      target: '#n8nChatMount',
      mode: 'fullscreen',
      showWelcomeScreen: false,
      defaultLanguage: 'pt',
      initialMessages: [
        'Olá! Sou o SOS Doméstico. No que posso ajudar hoje?.'
      ],
      i18n: {
        pt: {
          title: '',
          subtitle: '',
          footer: '',
          getStarted: 'Iniciar conversa',
          inputPlaceholder: 'Descreva o que está acontecendo...'
        }
      }
    });
  };
</script>

<script>
/* =========================================================
   SOS Doméstico — script principal
   1) Dados dos assuntos rápidos (chips) + textos enviados ao chat
   2) Alternância entre a capa e a tela do chat
   3) Envio automático da mensagem ao tocar em um chip
   ========================================================= */

const TOPICS = [
  { title: "Queimadura", prompt: "Uma pessoa se queimou, o que eu faço?" },
  { title: "Corte / sangramento", prompt: "Uma pessoa se cortou e está sangrando, o que eu faço?" },
  { title: "Queda", prompt: "Uma pessoa caiu, o que eu faço?" },
  { title: "Engasgo", prompt: "Uma pessoa engasgou, o que eu faço?" },
  { title: "Choque elétrico", prompt: "Uma pessoa levou um choque elétrico, o que eu faço?" },
  { title: "Intoxicação", prompt: "Uma pessoa se intoxicou, o que eu faço?" },
  { title: "Picada / mordida", prompt: "Uma pessoa foi picada ou mordida por um animal, o que eu faço?" },
  { title: "Hemorragia externa", prompt: "Uma pessoa está com hemorragia externa, o que eu faço?" },
  { title: "Convulsão / epilepsia", prompt: "Uma pessoa está tendo uma convulsão, o que eu faço?" }
];

/* ---------- 1) Chips de assuntos rápidos ---------- */
(function initChatTopics() {
  const wrap = document.getElementById("chatTopics");
  if (!wrap) return;

  wrap.innerHTML = TOPICS.map((item, index) => `
    <button type="button" class="topic-chip" data-index="${index}">${item.title}</button>
  `).join("");

  wrap.querySelectorAll(".topic-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const item = TOPICS[Number(chip.dataset.index)];
      if (item) sendPrefilledMessage(item.prompt);
    });
  });
})();

/* ---------- 2) Alternância capa <-> chat ---------- */
const coverScreen = document.getElementById("coverScreen");
const chatScreen = document.getElementById("chatScreen");
const enterChatBtn = document.getElementById("enterChatBtn");
const chatBackBtn = document.getElementById("chatBackBtn");

function openChatScreen(prefillText) {
  coverScreen.hidden = true;
  chatScreen.hidden = false;
  document.body.style.overflow = "hidden";
  if (window.__initN8nChat) window.__initN8nChat();
  if (prefillText) sendPrefilledMessage(prefillText);
}

function closeChatScreen() {
  chatScreen.hidden = true;
  coverScreen.hidden = false;
  document.body.style.overflow = "";
}

if (enterChatBtn) enterChatBtn.addEventListener("click", () => openChatScreen());
if (chatBackBtn) chatBackBtn.addEventListener("click", closeChatScreen);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !chatScreen.hidden) closeChatScreen();
});

/* ---------- 3) Envio automático da mensagem pré-definida ---------- */
function findChatInput() {
  const mount = document.getElementById("n8nChatMount");
  if (!mount) return null;
  return mount.querySelector("textarea, input[type='text']");
}

function sendPrefilledMessage(text) {
  let attempts = 0;
  const maxAttempts = 24; // ~6s no total
  const timer = setInterval(() => {
    attempts++;
    const field = findChatInput();
    if (field) {
      clearInterval(timer);
      const proto = field.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
      const setter = Object.getOwnPropertyDescriptor(proto, "value").set;
      setter.call(field, text);
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.focus();

      setTimeout(() => {
        const mount = document.getElementById("n8nChatMount");
        const sendBtn = mount && mount.querySelector(
          "button[type='submit'], button[aria-label*='send' i], button[aria-label*='enviar' i]"
        );
        if (sendBtn) {
          sendBtn.click();
        } else {
          field.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true }));
        }
      }, 200);
    } else if (attempts >= maxAttempts) {
      clearInterval(timer);
    }
  }, 250);
}
</script>
</body>
</html>
